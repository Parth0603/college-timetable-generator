services:
  - type: web
    name: college-timetable-generator
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timetable-db
          property: connectionString
      - key: PYTHON_COMMAND
        value: python3
      - key: PORT
        sync: false
    healthCheckPath: /health.php

  - type: postgres
    name: timetable-db
    plan: free
